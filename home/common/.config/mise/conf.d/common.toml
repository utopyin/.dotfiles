# Tools every platform installs through mise. Platform extras live in
# home/<platform>/.config/mise/config.toml.
[settings.npm]
package_manager = "bun"

[tools]
"aqua:modem-dev/hunk" = "latest"
"github:ariana-dot-dev/agent-server" = { version = "1.0.68", version_prefix = "boat-cli-v", bin = "boat" }
bun = "latest"
claude = "latest"
codex = "latest"
gh = "latest"
node = "26.7.0"
"npm:@withgraphite/graphite-cli" = "stable"
"npm:open-computer-use" = "0.3.2"
pi = "latest"
