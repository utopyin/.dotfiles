    {
      "trigger": "!qa",
      "replace": "i want you to plan out the QA session to ensure this whole stack (we're at the tip of the stacked PRs, please compare the diff against main) is mergeable to prod. The goal is to ensure we have 0 regressions. You'll find lots of new code introduced that is not in use yet, this is fine.\nYour goal is to have a thorough QA session so that at the end of the session you have confidence, or not, if this code brings no regression.\n\nIf you find bugs that prevent you from continuing, you may do hotfixes in order to keep going, just ensure you keep those in the git index so that i can review the hotfixes and decide if we need a stronger version of those or if we can amend existing commits at the root of the causes.\n\nYou have access Helium (the authenticated browser) with Computer and the default dev services are already running. If you need more services during this QA, feel free to start them using dev commands.\n\nThe database is {{secret_qa_database}}, and you should have access to it using the pscale MCP. If you need to run scripts, you must authenticate them using `infisical run --path next -- <script>`",
      "label": "QA Session"
    },
